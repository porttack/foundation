---
layout: default
---
<div class="page-hero">
  <div class="page-hero-inner">
    <h1>{{ page.title }}</h1>
    <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>
  </div>
</div>

<div class="page-content">
  <div class="content-inner">
    {{ content }}
    <hr>
    <p><a href="{{ '/news/' | relative_url }}">&larr; Back to News</a></p>
  </div>
</div>
